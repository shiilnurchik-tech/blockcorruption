# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G

# Speeds up repeated invocations (compileJava, runClient, etc.) by caching the
# whole task graph, skipping the configuration phase entirely on cache hits.
# Confirmed compatible with this project's build.gradle + Fabric Loom 1.17.13
# (both compileJava and a full runClient launch -- including joining a world
# and using nether portals -- work cleanly with this enabled). Also incidentally
# avoids a Loom-internal "Reading injected service of type Project at execution
# time" deprecation warning (an upstream Loom 1.17.13 issue, not something fixable
# from this project's own build.gradle) -- that code path in Loom's
# CompileConfiguration isn't exercised when the configuration cache is active.
org.gradle.configuration-cache=true

org.gradle.parallel=false

# Mod Properties
# don't forget to change changelog.md after bumping version
mod_version=7.0.0-alpha.1-1.21.11
maven_group=qouteall
archives_base_name=immersive-portals

modmenu_version=17.0.0
cloth_config_version=21.11.153
# Arena back-port: 1.21.11 artifacts (verified via third-party 1.21.11 pins:
# sidit77/better-mipmaps, Trainguy9512/locomotion). Used as compileOnly so the
# compat layer builds; runtime enablement stays off for the alpha
# (enable_sodium/enable_iris=false) — vanilla renderer is the required path.
sodium_path=maven.modrinth:sodium:mc1.21.11-0.8.2-fabric
iris_path=maven.modrinth:iris:1.10.0+1.21.11-fabric
# GravityChanger is not supported: upstream repo is archived and has no release
# beyond mc1.20.4. GravityChangerInterface.java stays permanently stubbed out
# with no-op defaults (see docs/migration-26.1-plan.md).
# DimLib (iPortalTeam/DimLib) is archived upstream with no 26.1-compatible release.
# Its source has been imported directly into this repo as a module
# (src/main/java/qouteall/dimlib) rather than maintained as a separate fork/dependency
# — see docs/migration-26.1-plan.md. midnightlib is DimLib's own config-screen dependency.
midnightlib_version=1.9.3+1.21.11-fabric
enable_sodium=false
enable_iris=false
enable_pehkui=false
enable_test_mod=false
enable_geckolib=false

# don't forget to update this if branch changes
git_branch=port/1.21.11

# Arena back-port target: Minecraft 1.21.11 (between the 1.21.2+ render rewrite and
# the 26.1 RenderPipeline/frame-graph rewrite — see PORTING-1.21.11.md at repo root).
minecraft_version=1.21.11
loader_version=0.19.5

# Fabric API
fabric_version=0.141.6+1.21.11

